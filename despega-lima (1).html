<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despega Lima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a departures-board catalog. Every destination is a luggage tag led by its IATA code,
   sorted like a store shelf; detail view is a flight list with a separate price calendar. */
:root {
  --bg: #E8EDF1;
  --surface: #F7F9FB;
  --surface2: #DCE4EA;
  --fg: #121C26;
  --muted: #53626F;
  --line: #C7D1D9;
  --accent: #F2A93B;
  --accent-fg: #1A1204;
  --price: #8A4E00;
  --good: #1F7A5A;
  --warn: #B3481E;
  --heat-a: 46%;
  --heat-b: 22%;
  --art1: 34%;
  --art2: 46%;
  --focus: #1B5FD1;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1721; --surface: #14212E; --surface2: #1C2D3D; --fg: #E6EDF3; --muted: #92A3B2; --line: #26384A;
    --price: #FFC15E; --good: #4FC59A; --warn: #F08A5D; --heat-a: 40%; --heat-b: 18%; --art1: 22%; --art2: 32%; --focus: #7FB0FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1721; --surface: #14212E; --surface2: #1C2D3D; --fg: #E6EDF3; --muted: #92A3B2; --line: #26384A;
  --price: #FFC15E; --good: #4FC59A; --warn: #F08A5D; --heat-a: 40%; --heat-b: 18%; --art1: 22%; --art2: 32%; --focus: #7FB0FF;
  color-scheme: dark;
}
:root { color-scheme: light; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 32px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.05; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .01em; }
.brand .tag { font-family: var(--mono); font-size: 12px; font-weight: 500; background: var(--accent); color: var(--accent-fg); padding: 3px 7px; border-radius: 4px; letter-spacing: .08em; }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.demo { background: var(--surface2); border: 1px dashed var(--muted); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.demo b { color: var(--fg); }

/* hero */
.hero { padding-block: 28px 18px; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }

/* toolbar */
.toolbar { display: grid; gap: 12px; padding-block: 10px 16px; border-block: 1px solid var(--line); margin-block-end: 18px; }
.trow { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.field input[type="search"], .field select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--fg); min-width: 0; }
.field input[type="search"] { width: min(280px, 100%); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--good); }
.range { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.range input { width: min(220px, 100%); accent-color: var(--price); }
.count { font-size: 13px; color: var(--muted); margin-inline-start: auto; }

/* destination grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; text-align: start; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; overflow: hidden; transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.card:hover { transform: translateY(-3px); border-color: var(--muted); }
.art { position: relative; height: 104px; background: linear-gradient(135deg, hsl(var(--h) 52% var(--art1)), hsl(calc(var(--h) + 32) 58% var(--art2))); color: #fff; overflow: hidden; }
.art .big { position: absolute; inset-inline-start: 12px; bottom: -14px; font-family: var(--display); font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: .02em; opacity: .28; }
.art .rt { position: absolute; inset-inline-start: 12px; top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; opacity: .92; }
.art .st { position: absolute; inset-inline-end: 10px; top: 8px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.34); padding: 2px 8px; border-radius: 999px; }
.art .perf { position: absolute; inset-inline: 0; bottom: 0; height: 0; border-bottom: 2px dotted rgba(255,255,255,.55); }
.cbody { padding: 11px 13px 13px; display: grid; gap: 2px; }
.cbody h3 { font-size: 24px; }
.cbody .ctry { color: var(--muted); font-size: 13px; }
.cfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding-top: 8px; }
.cfoot .dur { font-size: 12px; color: var(--muted); }
.from { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: block; text-align: end; }
.pr { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--price); font-variant-numeric: tabular-nums; line-height: 1; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* detail */
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-size: 14px; margin-block: 6px 16px; }
.dhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.dhead .code { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .9; color: var(--price); letter-spacing: .02em; }
.dhead h2 { font-size: clamp(30px, 5vw, 44px); }
.dhead p { margin: 2px 0 0; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-block: 18px; }
.fact { background: var(--surface); padding: 10px 14px; }
.fact span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fact b { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.dlayout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 16px; }
.filters h3 { font-size: 15px; font-family: var(--body); font-weight: 600; margin-block-end: 6px; }
.fgroup { display: grid; gap: 6px; }
.stack { display: grid; gap: 6px; }
.reset { border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-align: start; padding: 0; font-size: 13px; }
.listhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-block-end: 12px; }
.listhead .count { margin-inline-start: 0; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 600; text-decoration: none; font-size: 14px; white-space: nowrap; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.datechip { display: inline-flex; gap: 8px; align-items: center; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.datechip button { border: 0; background: rgba(127,127,127,.35); color: inherit; border-radius: 50%; width: 22px; height: 22px; line-height: 1; }
.itins { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.it { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.it .main { display: grid; gap: 8px; min-width: 0; }
.airline { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.abadge { font-family: var(--mono); font-size: 12px; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: hsl(var(--h) 42% 34%); }
.route { display: flex; align-items: center; gap: 6px; }
.n { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--bg); }
.n.via { border-color: var(--muted); }
.ln { flex: 1; height: 0; border-top: 2px solid var(--line); min-width: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.ok { color: var(--good); font-weight: 600; }
.no { color: var(--warn); font-weight: 600; }
.buy { display: grid; gap: 6px; justify-items: end; text-align: end; }
.buy .price { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--price); line-height: 1; font-variant-numeric: tabular-nums; }
.buy .pnote { font-size: 12px; color: var(--muted); }
.noop { color: var(--muted); font-size: 14px; }

/* calendar overlay */
.overlay { position: fixed; inset: 0; background: rgba(5, 10, 16, .66); z-index: 50; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; align-items: flex-start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); padding: 18px; display: grid; gap: 14px; }
.phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.phead h2 { font-size: 30px; }
.phead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.xbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 36px; height: 36px; font-size: 18px; flex: none; }
.mnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mnav b { font-family: var(--display); font-size: 24px; text-transform: capitalize; }
.mnav button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; }
.mnav button:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font-size: 11px; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day { border: 1px solid transparent; border-radius: 6px; min-height: 52px; padding: 4px 2px; display: grid; align-content: center; justify-items: center; gap: 1px; background: var(--surface2); }
.day .dn { font-size: 11px; color: var(--muted); }
.day .dp { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.day.off { background: transparent; border: 1px dashed var(--line); cursor: default; }
.day.off .dp, .day.off .dn { color: var(--line); }
.day.blank { visibility: hidden; }
.day.h0 { background: color-mix(in srgb, var(--good) var(--heat-a), var(--surface)); }
.day.h1 { background: color-mix(in srgb, var(--good) var(--heat-b), var(--surface)); }
.day.h2 { background: var(--surface2); }
.day.h3 { background: color-mix(in srgb, var(--warn) var(--heat-b), var(--surface)); }
.day.h4 { background: color-mix(in srgb, var(--warn) var(--heat-a), var(--surface)); }
.day.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend .bar { display: flex; border-radius: 4px; overflow: hidden; }
.legend .bar i { width: 26px; height: 10px; display: block; }
.pfoot { font-size: 12px; color: var(--muted); margin: 0; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-block-end: 14px; }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.fact small { display: block; color: var(--muted); font-size: 12px; }
.fact b { text-transform: capitalize; }

/* yearly chart */
.chartbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 4px; margin-block-end: 10px; }
.chartbox svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.ax { fill: var(--muted); font: 11px var(--mono); }
.tip { position: absolute; top: 10px; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 12px; pointer-events: none; min-width: 160px; z-index: 2; }
.tip b { font-family: var(--display); font-size: 19px; display: block; text-transform: capitalize; line-height: 1.1; margin-block-end: 3px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 20px; height: 3px; border-radius: 2px; display: inline-block; }
.dot { width: 11px; height: 11px; border: 2px solid var(--fg); border-radius: 50%; display: inline-block; }
.tablewrap { overflow-x: auto; margin-block: 14px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.mt { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.mt th, .mt td { padding: 8px 12px; text-align: end; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mt th:first-child, .mt td:first-child { text-align: start; text-transform: capitalize; }
.mt th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.mt tr:last-child td { border-bottom: 0; }
.mt tr.best td { background: color-mix(in srgb, var(--good) var(--heat-b), var(--surface)); }
.mt tr.worst td { background: color-mix(in srgb, var(--warn) var(--heat-b), var(--surface)); }
.toast { position: fixed; inset-inline: 16px; bottom: 20px; margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 14px; }
footer { max-width: 1180px; margin-inline: auto; padding-block: 28px 8px; color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  .dlayout { grid-template-columns: minmax(0, 1fr); }
  .it { grid-template-columns: minmax(0, 1fr); }
  .buy { justify-items: start; text-align: start; grid-template-columns: auto 1fr; align-items: center; }
  .buy .btn { grid-column: 1 / -1; }
  .count { margin-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="brandName">Despega Lima</span><span class="tag">LIM</span></div>
    <div class="toggles">
      <div class="seg" role="group" id="langSeg"><button type="button" data-act="lang" data-v="es" aria-pressed="true">ES</button><button type="button" data-act="lang" data-v="en" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" id="curSeg"><button type="button" data-act="cur" data-v="USD" aria-pressed="true">USD</button><button type="button" data-act="cur" data-v="PEN" aria-pressed="false">PEN</button></div>
    </div>
  </header>
  <nav class="tabs" aria-label="Secciones"><a href="#vuelos" id="tabF"></a><a href="#grafica" id="tabC"></a></nav>
  <div class="demo" id="demo"></div>

  <main id="home">
    <section class="hero"><h1 id="heroTitle"></h1><p id="heroSub"></p></section>
    <div class="toolbar" id="toolbar"></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <main id="detail" hidden></main>

  <main id="chartview" hidden></main>
</div>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="calTitle"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<footer id="foot"></footer>

    var maxD = Math.ceil(Math.max.apply(null, its.map(function (i) { return i.mins; })) / 60) * 60, minD = Math.floor(Math.min.apply(null, its.map(function (i) { return i.mins; })) / 60) * 60;

      '<button type="button" class="back" data-act="back">← ' + t('back') + '</button>' +
      '<div class="dhead"><div class="code" aria-hidden="true">' + d.iata + '</div><div><h2>' + t('routeOf', { c: esc(d.city[S.lang]) }) + '</h2><p>' + esc(d.country[S.lang]) + ' · ' + t('oneWay') + '</p></div></div>' +
      '<div class="facts"><div class="fact"><span>' + t('cheapest') + '</span><b>' + money(s.price) + '</b></div><div class="fact"><span>' + t('fastest') + '</span><b>' + dur(s.mins) + '</b></div><div class="fact"><span>' + t('options') + '</span><b>' + its.length + '</b></div></div>' +
      '<div class="dlayout"><aside class="filters" aria-label="Filtros">' +
      '<div class="fgroup"><h3>' + t('stopsF') + '</h3>' + seg([['all', t('any')], ['0', t('nonstop')], ['1', t('s1')], ['2', t('s2')]], 'stops', S.f.stops) + '</div>' +
      '<div class="fgroup"><h3>' + t('airlines') + '</h3><div class="stack">' + airs.map(function (c) { return '<label class="check"><input type="checkbox" data-act="air" data-v="' + c + '">' + esc(FL.AIR[c].n) + '</label>'; }).join('') + '</div></div>' +
      '<div class="fgroup"><h3>' + t('maxDur') + '</h3><label class="range"><span id="durl"></span><input type="range" id="maxdur" min="' + minD + '" max="' + maxD + '" step="30" value="' + maxD + '" data-max="' + maxD + '"></label></div>' +
      '<label class="check"><input type="checkbox" id="bag">' + t('bag') + '</label>' +
      '<button type="button" class="reset" data-act="reset">' + t('reset') + '</button></aside>' +
      '<section><div class="listhead"><span class="count" id="icount"></span><span id="dchip"></span><span class="spacer"></span>' +
      '<label class="field" style="flex-direction:row;align-items:center;gap:8px">' + t('sort') + '<select id="isort">' + [['price', 'sPrice'], ['duration', 'sDur'], ['stops', 'sStops']].map(function (o) { return '<option value="' + o[0] + '">' + t(o[1]) + '</option>'; }).join('') + '</select></label>' +
      '<button type="button" class="btn ghost" data-act="tochart">' + t('chartBtn') + '</button><button type="button" class="btn" data-act="cal">' + t('cal') + '</button></div><ol class="itins" id="itins"></ol></section></div>';
    renderItins();
  }
  function renderItins() {
    var its = FL.itinsFor(S.iata), maxD = Number($('maxdur').dataset.max), v = Number($('maxdur').value);
    S.f.maxDur = v >= maxD ? null : v; S.f.bag = $('bag').checked; S.f.sort = $('isort').value;
    $('durl').textContent = S.f.maxDur == null ? t('noLimit') : '≤ ' + dur(S.f.maxDur);
    var list = FL.rows(FL.filterItins(its, S.f), S.f);
    $('icount').textContent = list.length + ' / ' + its.length + ' ' + t('options').toLowerCase();
    $('dchip').innerHTML = S.f.date ? '<span class="datechip">' + fmtDate(S.f.date, true) + '<button type="button" data-act="cleardate" aria-label="' + t('clearDate') + '">×</button></span>' : '';
    $('itins').innerHTML = list.length ? list.map(itinHTML).join('') : '<li class="empty">' + t('noIt') + '</li>';
  }
  function itinHTML(r) {
    var it = r.itin, a = it.air, nodes = '<span class="n">LIM</span>';
    it.via.forEach(function (h) { nodes += '<span class="ln"></span><span class="n via">' + h + '</span>'; });
    nodes += '<span class="ln"></span><span class="n">' + it.iata + '</span>';
    var lay = it.via.map(function (h, i) { return h + ' · ' + t('wait', { d: dur(it.layovers[i]) }); }).join(' · ');
    var price = r.price == null ? '<div class="noop">' + t('noOp') + '</div>' :
      '<div class="price">' + money(r.price) + '</div><div class="pnote">' + (S.f.date ? t('onDay', { d: fmtDate(r.date) }) : t('cheapOn', { d: fmtDate(r.date) })) + '</div>';
    return '<li class="it"><div class="main"><div class="airline"><span class="abadge" style="--h:' + a.hue + '">' + a.code + '</span>' + esc(a.n) + '</div>' +
      '<div class="route" aria-hidden="true">' + nodes + '</div>' +
      '<div class="meta"><span><b>' + stopsLabel(it.stops) + '</b>' + (lay ? ' · ' + lay : '') + '</span><span>' + t('departs', { t: it.dep }) + ' · <b>' + dur(it.mins) + '</b></span></div>' +
      '<div class="meta"><span class="ok">✓ ' + t('carry') + '</span>' + (it.checked ? '<span class="ok">✓ ' + t('checked', { kg: it.kg }) + '</span>' : '<span class="no">✗ ' + t('noChecked') + '</span>') + '</div></div>' +
      '<div class="buy">' + price + '<button type="button" class="btn" data-act="offer" data-v="' + it.id + '">' + t('go') + '</button></div></li>';
  }

  /* ---------- calendar ---------- */
  function openCal(opener) {
    S.opener = opener || null;
    var ms = FL.months(); if (!S.month || ms.indexOf(S.month) < 0) S.month = (S.f.date ? S.f.date.slice(0, 7) : ms[0]);
    renderCal(); $('overlay').hidden = false; $('panel').querySelector('.xbtn').focus();
  }
  function closeCal() { $('overlay').hidden = true; if (S.opener && document.body.contains(S.opener)) S.opener.focus(); }
  function renderCal() {
    var d = FL.destOf(S.iata), ms = FL.months(), i = ms.indexOf(S.month), its = FL.filterItins(FL.itinsFor(S.iata), S.f), c = FL.calendar(its, S.month);
    var dows = []; for (var k = 0; k < 7; k++) dows.push(new Intl.DateTimeFormat(loc(), { weekday: 'narrow', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, 1 + k))));
    var cells = ''; for (var b = 0; b < c.lead; b++) cells += '<span class="day blank"></span>';
    c.cells.forEach(function (x) {
      if (x.price == null) cells += '<span class="day off" title="' + t('unavail') + '"><span class="dn">' + x.day + '</span><span class="dp">–</span></span>';
      else cells += '<button type="button" class="day h' + FL.heat(x.price, c.min, c.max) + (S.f.date === x.date ? ' sel' : '') + '" data-act="pick" data-v="' + x.date + '" aria-label="' + fmtDate(x.date, true) + ', ' + money(x.price) + '"><span class="dn">' + x.day + '</span><span class="dp">' + num(x.price) + '</span></button>';
    });
    $('panel').innerHTML =
      '<div class="phead"><div><h2 id="calTitle">' + t('calT') + ' · ' + esc(d.city[S.lang]) + '</h2><p>' + t('calHint') + '</p></div><button type="button" class="xbtn" data-act="closecal" aria-label="' + t('close') + '">×</button></div>' +
      '<div class="mnav"><button type="button" data-act="mprev"' + (i <= 0 ? ' disabled' : '') + ' aria-label="' + t('prev') + '">←</button><b>' + monthName(S.month) + '</b><button type="button" data-act="mnext"' + (i >= ms.length - 1 ? ' disabled' : '') + ' aria-label="' + t('next') + '">→</button></div>' +
      '<div class="cal">' + dows.map(function (w) { return '<span class="dow">' + w + '</span>'; }).join('') + cells + '</div>' +
      '<div class="legend"><span>' + t('cheapL') + '</span><span class="bar"><i class="day h0"></i><i class="day h1"></i><i class="day h2"></i><i class="day h3"></i><i class="day h4"></i></span><span>' + t('priceyL') + '</span><span class="spacer"></span><span>' + t('pricesIn', { c: S.cur }) + '</span></div>' +
      '<p class="pfoot">' + t('oneWay') + '</p>';
  }

  /* ---------- yearly chart ---------- */
  function monthShort(ym, narrow) { var p = ym.split('-').map(Number); return new Intl.DateTimeFormat(loc(), { month: narrow ? 'narrow' : 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(p[0], p[1] - 1, 1))).replace('.', ''); }
  function monthLong(ym) { var p = ym.split('-').map(Number); return new Intl.DateTimeFormat(loc(), { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(p[0], p[1] - 1, 1))); }
  function conv(usd) { return S.cur === 'PEN' ? usd * FL.USD_PEN : usd; }
  function niceStep(x) { var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), f = x / p; return (f <= 1.5 ? 1 : f <= 3 ? 2 : f <= 7 ? 5 : 10) * p; }

  function buildChart() {
    var opts = FL.DEST.slice().sort(function (a, b) { return a.city[S.lang].localeCompare(b.city[S.lang], S.lang); }).map(function (d) {
      return '<option value="' + d.iata + '"' + (d.iata === S.cIata ? ' selected' : '') + '>' + esc(d.city[S.lang]) + ' (' + d.iata + ')</option>';
    }).join('');
    $('chartview').innerHTML =
      '<section class="hero"><h1>' + t('chartT') + '</h1><p>' + t('chartSub') + '</p></section>' +
      '<div class="trow" style="margin-block-end:14px"><label class="field">' + t('destL') + '<select id="cdest">' + opts + '</select></label><span class="spacer"></span><button type="button" class="btn ghost" data-act="toflights">' + t('seeThis') + '</button></div>' +
      '<div class="facts" id="cfacts"></div>' +
      '<div class="chartbox" id="chartbox"><svg id="csvg" role="img"></svg><div class="tip" id="tip" hidden></div></div>' +
      '<div class="legend" id="clegend"></div>' +
      '<div class="tablewrap"><table class="mt" id="ctable"></table></div><p class="pfoot" id="cnote"></p>';
    drawChart();
  }

  function drawChart() {
    var d = FL.destOf(S.cIata), ser = FL.yearSeries(S.cIata), ok = ser.filter(function (x) { return x.avg != null; });
    var best = ok.reduce(function (a, b) { return b.avg < a.avg ? b : a; }), worst = ok.reduce(function (a, b) { return b.avg > a.avg ? b : a; });
    var lowest = Math.min.apply(null, ok.map(function (x) { return x.min; })), diff = Math.round((worst.avg - best.avg) / best.avg * 100);
    var partial = FL.windowStart().slice(8) !== '01';
    function fact(label, val, sub) { return '<div class="fact"><span>' + label + '</span><b>' + val + '</b>' + (sub ? '<small>' + sub + '</small>' : '<small>&nbsp;</small>') + '</div>'; }
    $('cfacts').innerHTML = fact(t('lowestY'), money(lowest)) + fact(t('bestM'), monthLong(best.ym), t('avgNote', { p: money(best.avg) })) + fact(t('worstM'), monthLong(worst.ym), t('avgNote', { p: money(worst.avg) })) + fact(t('varL'), '+' + diff + '%');

    var box = $('chartbox'), svg = $('csvg'), W = Math.max(280, Math.floor(box.clientWidth) - 12), narrow = W < 520, H = narrow ? 280 : 340;
    var m = { l: narrow ? 46 : 58, r: 14, t: 16, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b, n = ser.length;
    var lo = Math.min.apply(null, ok.map(function (x) { return conv(x.min); })), hi = Math.max.apply(null, ok.map(function (x) { return conv(x.max); }));
    var step = niceStep(((hi - lo) * 1.1 / 4) || (hi * 0.05) || 1);
    lo = Math.max(0, Math.floor(lo * 0.97 / step) * step); hi = Math.ceil(hi * 1.03 / step) * step; if (hi <= lo) hi = lo + step;
    function X(i) { return m.l + pw * (i + 0.5) / n; }
    function Yv(v) { return m.t + ph * (1 - (v - lo) / (hi - lo)); }
    function Y(usd) { return Yv(conv(usd)); }
    var idx = []; ser.forEach(function (x, i) { if (x.avg != null) idx.push(i); });
    function pts(k) { return idx.map(function (i) { return X(i).toFixed(1) + ',' + Y(ser[i][k]).toFixed(1); }); }

    var g = '';
    for (var v = lo; v <= hi + step / 1000; v += step) {
      var yy = Yv(v).toFixed(1);
      g += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" style="stroke:var(--line);stroke-width:1"/>';
      g += '<text class="ax" x="' + (m.l - 8) + '" y="' + yy + '" dy="4" text-anchor="end">' + Math.round(v).toLocaleString(loc()) + '</text>';
    }
    ser.forEach(function (x, i) { g += '<text class="ax" x="' + X(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + monthShort(x.ym, W / n < 34) + '</text>'; });
    g += '<polygon points="' + pts('max').concat(pts('min').reverse()).join(' ') + '" style="fill:var(--good);fill-opacity:.14"/>';
    g += '<polyline points="' + pts('avg').join(' ') + '" style="fill:none;stroke:var(--price);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:6 4"/>';
    g += '<polyline points="' + pts('min').join(' ') + '" style="fill:none;stroke:var(--good);stroke-width:2.5;stroke-linejoin:round"/>';
    idx.forEach(function (i) {
      g += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(ser[i].min).toFixed(1) + '" r="3.5" style="fill:var(--good);stroke:var(--surface);stroke-width:1.5"/>';
      g += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(ser[i].avg).toFixed(1) + '" r="3" style="fill:var(--price);stroke:var(--surface);stroke-width:1.5"/>';
    });
    [best, worst].forEach(function (x) { g += '<circle cx="' + X(ser.indexOf(x)).toFixed(1) + '" cy="' + Y(x.avg).toFixed(1) + '" r="7" style="fill:none;stroke:var(--fg);stroke-width:2"/>'; });
    g += '<line id="ccur" y1="' + m.t + '" y2="' + (m.t + ph) + '" style="stroke:var(--muted);stroke-width:1;display:none"/>';
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('aria-label', t('chartAria', { c: d.city[S.lang], a: monthLong(best.ym), b: monthLong(worst.ym) }));
    svg.innerHTML = g;

    var cur = svg.querySelector('#ccur'), tip = $('tip');
    function show(ev) {
      var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
      var i = Math.max(0, Math.min(n - 1, Math.round((x - m.l) / pw * n - 0.5))), row = ser[i];
      if (row.avg == null) return;
      cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = '';
      tip.innerHTML = '<b>' + monthName(row.ym) + '</b><div><span>' + t('minL') + '</span><span>' + money(row.min) + '</span></div><div><span>' + t('avgL') + '</span><span>' + money(row.avg) + '</span></div><div><span>' + t('maxL') + '</span><span>' + money(row.max) + '</span></div>';
      tip.hidden = false;
      var px = svg.offsetLeft + X(i) * (r.width / W), left = px + 14;
      if (left + tip.offsetWidth > box.clientWidth - 4) left = px - tip.offsetWidth - 14;
      tip.style.left = Math.max(4, left) + 'px';
    }
    svg.onpointermove = show; svg.onpointerdown = show;
    svg.onpointerleave = function () { tip.hidden = true; cur.style.display = 'none'; };

    $('clegend').innerHTML = '<span class="lg"><i class="sw" style="background:var(--good)"></i>' + t('minL') + '</span>' +
      '<span class="lg"><i class="sw" style="background:repeating-linear-gradient(90deg,var(--price) 0 6px,transparent 6px 10px)"></i>' + t('avgL') + '</span>' +
      '<span class="lg"><i class="sw" style="background:var(--good);opacity:.28;height:10px"></i>' + t('rangeL') + '</span>' +
      '<span class="lg"><i class="dot"></i>' + t('ringL') + '</span><span class="spacer"></span><span>' + t('pricesIn', { c: S.cur }) + ' · ' + t('oneWay') + '</span>';
    $('ctable').innerHTML = '<thead><tr><th>' + t('monthL') + '</th><th>' + t('minL') + '</th><th>' + t('avgL') + '</th><th>' + t('maxL') + '</th></tr></thead><tbody>' +
      ser.map(function (x, i) {
        if (x.avg == null) return '';
        return '<tr class="' + (x === best ? 'best' : x === worst ? 'worst' : '') + '"><td>' + monthName(x.ym) + (i === 0 && partial ? ' *' : '') + '</td><td>' + money(x.min) + '</td><td>' + money(x.avg) + '</td><td>' + money(x.max) + '</td></tr>';
      }).join('') + '</tbody>';
    $('cnote').textContent = partial ? t('partial') : '';
  }
  window.addEventListener('resize', function () { if (!$('chartview').hidden) drawChart(); });

  /* ---------- routing + toast ---------- */
  function route() {
    var onChart = location.hash === '#grafica';
    $('home').hidden = onChart || !!S.iata; $('detail').hidden = onChart || !S.iata; $('chartview').hidden = !onChart;
    document.querySelectorAll('.tabs a').forEach(function (a) { a.setAttribute('aria-current', (a.getAttribute('href') === '#grafica') === onChart ? 'page' : 'false'); });
    if (onChart) { if (!S.cIata) S.cIata = S.iata || 'MAD'; buildChart(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  var toastT;
  function showToast(msg) { var el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2600); }

  /* ---------- events ---------- */
  function setLang(l) { S.lang = l; try { localStorage.setItem('dl-lang', l); } catch (e) {} syncSeg(); document.documentElement.lang = l; refresh(); }
  function setCur(c) { S.cur = c; try { localStorage.setItem('dl-cur', c); } catch (e) {} syncSeg(); refresh(); }
  function syncSeg() {
    document.querySelectorAll('#langSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === S.lang)); });
    document.querySelectorAll('#curSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === S.cur)); });
  }
  function refresh() {
    buildHome();
    if (S.iata) {
      var air = S.f.air.slice(), keep = S.f; buildDetail();
      keep.air = air; S.f = keep; $('maxdur').value = keep.maxDur == null ? $('maxdur').dataset.max : keep.maxDur; $('bag').checked = keep.bag; $('isort').value = keep.sort;
      document.querySelectorAll('[data-act="air"]').forEach(function (c) { c.checked = air.indexOf(c.dataset.v) >= 0; });
      renderItins();
      if (!$('overlay').hidden) renderCal();
    }
    if (!$('chartview').hidden) buildChart();
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (el && el.tagName === 'INPUT') return;
    if (e.target === $('overlay')) { closeCal(); return; }
    if (!el) return; var v = el.dataset.v;
    switch (el.dataset.act) {
      case 'lang': setLang(v); break;
      case 'cur': setCur(v); break;
      case 'region': S.region = v; document.querySelectorAll('[data-act="region"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); }); renderGrid(); break;
      case 'open': openDest(v); break;
      case 'back': closeDest(); break;
      case 'stops': S.f.stops = v; document.querySelectorAll('[data-act="stops"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); }); renderItins(); break;
      case 'reset': var d0 = S.f.date; openDest(S.iata); S.f.date = d0; renderItins(); break;
      case 'cal': openCal(el); break;
      case 'closecal': closeCal(); break;
      case 'mprev': case 'mnext': var ms = FL.months(), ix = ms.indexOf(S.month) + (el.dataset.act === 'mnext' ? 1 : -1); if (ix >= 0 && ix < ms.length) { S.month = ms[ix]; renderCal(); $('panel').querySelector('[data-act="' + el.dataset.act + '"]').focus(); } break;
      case 'pick': S.f.date = v; closeCal(); renderItins(); break;
      case 'cleardate': S.f.date = null; renderItins(); break;
      case 'tochart': S.cIata = S.iata; location.hash = 'grafica'; break;
      case 'toflights': location.hash = 'vuelos'; openDest(S.cIata); break;
      case 'offer': showToast(t('toastDemo')); break;
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { S.q = e.target.value; renderGrid(); }
    else if (id === 'maxp') renderGrid();
    else if (id === 'maxdur') renderItins();
  });
  document.addEventListener('change', function (e) {
    var el = e.target, id = el.id;
    if (id === 'sort') { S.sort = el.value; renderGrid(); }
    else if (id === 'direct') { S.direct = el.checked; renderGrid(); }
    else if (id === 'cdest') { S.cIata = el.value; drawChart(); }
    else if (id === 'bag' || id === 'isort') renderItins();
    else if (el.dataset.act === 'air') { var a = S.f.air, i = a.indexOf(el.dataset.v); if (el.checked && i < 0) a.push(el.dataset.v); if (!el.checked && i >= 0) a.splice(i, 1); renderItins(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('overlay').hidden) closeCal(); else if (S.iata && location.hash !== '#grafica') closeDest();
  });

  document.documentElement.lang = S.lang; syncSeg(); buildHome(); route();
})();
</script>
</body>
</html>
